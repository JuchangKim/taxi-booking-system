name: Taxi Booking CI

# Run the quality checks on every push or pull request so booking, admin, and chatbot changes are validated early.
on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository so the workflow can lint and test the project files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install PHP so the backend pages are syntax-checked before deployment.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli

      # Install the Python runtime needed by the chatbot service and the automated tests.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Node.js so the browser-level E2E tests and Jest checks can run in CI.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install the chatbot dependencies and pytest so the feature-based checks can run in CI.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chatbot/requirements.txt pytest

      # Install the JavaScript test tools, including Playwright browser automation.
      - name: Install Node dependencies
        run: npm install

      # Install the Chromium browser used by the E2E user-flow tests.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Run PHP syntax validation on all booking and admin backend files.
      - name: Validate PHP syntax
        run: |
          find php -name '*.php' -print0 | xargs -0 -n1 php -l

      # Execute the unit tests covering booking validation and the chatbot prompt flow.
      - name: Run Python and Jest tests
        run: |
          pytest tests -q
          npm test -- --runInBand

      # Run the browser-level E2E scenario tests to validate real user flows.
      - name: Run Playwright E2E tests
        run: npm run test:e2e
