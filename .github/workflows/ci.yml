name: Taxi Booking CI

# Run the quality checks on every push or pull request so booking and chatbot changes are validated early.
on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository so the workflow can lint and test the project files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install PHP so the backend pages are syntax-checked before deployment.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli

      # Install the Python runtime needed by the chatbot service and the automated tests.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install the chatbot dependencies and pytest so the feature-based checks can run in CI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chatbot/requirements.txt pytest

      # Run PHP syntax validation on all booking and admin backend files.
      - name: Validate PHP syntax
        run: |
          find php -name '*.php' -print0 | xargs -0 -n1 php -l

      # Execute the unit tests covering booking validation and the chatbot prompt flow.
      - name: Run automated tests
        run: pytest tests -q
